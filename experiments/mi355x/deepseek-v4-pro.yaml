# GENERATED by scripts/gen_mi355x_manifests.py — edit that, not this.
# MI355X shard: deepseek-v4-pro (2 node(s) budgeted, single node, TP=8).
# Power-cap arm: run the `powercap` variant only after
#   amd-smi set --power-cap <watts>     (record the value; restore after)
# No --pmc anywhere: counters serialize kernels (offline Tier-2 only).
# Check it (and the guidellm backend model= below) before launching.
gpu_counts:
- 8
experiments:
- name: deepseek-v4-pro-tp8
  model: deepseek-ai/DeepSeek-V4-Pro
  prompt: unused - guidellm_command supplies synthetic data
  tp: 8
  env:
    VLLM_ROCM_USE_AITER: '1'
  vllm_args:
  - --trust-remote-code
  - --tensor-parallel-size
  - '8'
  - --gpu-memory-utilization
  - '0.92'
  - --max-num-batched-tokens
  - '8192'
  - --max-num-seqs
  - '256'
  guidellm_command:
  - run
  - --backend
  - kind=openai_http,target=http://localhost:8000/v1,model=deepseek-ai/DeepSeek-V4-Pro,max_tokens=1024
  - --profile
  - kind=concurrent,streams=16,warmup=0.1,cooldown=0.1
  - --constraint
  - kind=max_duration,seconds=300
  - --constraint
  - kind=over_saturation
  - --data
  - kind=synthetic_text,prompt_tokens=16384,output_tokens=1024
  - --output
  - kind=json,path=/workspace/deepseek-v4-pro-tp8.json
  variants:
  - name: base
    metadata:
      arm: tuned
  - name: rccl-log
    env:
      RCCL_DEBUG: INFO
    metadata:
      arm: tuned+rccl-log
      note: algo/proto choice lands in the telemetry dir's server.log
  - name: bad-tiny-batch
    vllm_args:
    - --max-num-batched-tokens
    - '1024'
    - --max-num-seqs
    - '16'
    metadata:
      arm: bad
      broken_knob: batching starved
  - name: bad-no-graphs
    vllm_args:
    - --enforce-eager
    metadata:
      arm: bad
      broken_knob: eager execution / launch gaps
  - name: bad-kv-squeeze
    vllm_args:
    - --gpu-memory-utilization
    - '0.60'
    metadata:
      arm: bad
      broken_knob: KV squeezed; preemption pressure
  - name: powercap
    metadata:
      arm: powercap
      note: identical config to base; host power cap lowered first. Sampler records cap+energy, so tokens/joule
        is measured.
