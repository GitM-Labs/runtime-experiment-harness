# beat arm 5/5 — TP8, ONE short high-concurrency pass with rocprof ON, to
# capture the c128 kernel trace we lack at peak load. Parallel shard. Short
# 150s window so rocprofv3 exits cleanly (the 3h pareto server died under it).
# Analyze with scripts/rocprof_kernel_summary.py on this run's trace.
gpu_counts:
- 8
experiments:
- name: beat-trace
  model: moonshotai/Kimi-K2.5
  prompt: unused
  tp: 8
  # The one experiment that DOES trace: opt in with REX_ROCPROF=1 (tracing is
  # off by default now). Short pass so rocprofv3 exits cleanly.
  env: {VLLM_ROCM_USE_AITER: '1', REX_ROCPROF: '1'}
  vllm_args:
  - --trust-remote-code
  - --gpu-memory-utilization
  - '0.92'
  - --max-num-batched-tokens
  - '8192'
  - --max-num-seqs
  - '256'
  - --no-enable-prefix-caching
  - --mm-encoder-tp-mode
  - data
  - --tool-call-parser
  - kimi_k2
  - --enable-auto-tool-choice
  - --reasoning-parser
  - kimi_k2
  guidellm_passes:
  - {name: 8k1k-c128-traced, metadata: {isl: 8192, osl: 1024, concurrency: 128}, guidellm_command: [run, --backend, 'kind=openai_http,target=http://localhost:8000/v1,model=moonshotai/Kimi-K2.5,max_tokens=1024', --profile, 'kind=concurrent,streams=128,warmup=0.1,cooldown=0.1', --constraint, 'kind=max_duration,seconds=150', --data, 'kind=synthetic_text,prompt_tokens=8192,output_tokens=1024']}
