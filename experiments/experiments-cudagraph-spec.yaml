# CUDA-graph mode and speculative-decoding sweep for Qwen3.6-35B-A3B.
#
#   rex run --config experiments-cudagraph-spec.yaml
#
# Eight arms from one entry. Everything except `variants` is shared, which is the
# point: a sweep whose arms differ in more than the thing under test measures
# nothing, and hand-written near-duplicate blocks drift on exactly the fields
# nobody meant to vary.
#
# Ordering is deliberate. `full-and-piecewise` is vLLM's own default and runs
# FIRST so that if the pod is misconfigured you find out on the control arm rather
# than seven arms in. `eager` runs LAST because it is the slowest by far -- a prior
# H200 measurement put it at 7.5% GPU active against 46.5% under graphs -- so
# losing it to a timeout costs the least.
#
# READ BEFORE TRUSTING THE RESULTS: vLLM *resolves* cudagraph_mode and may downgrade
# it. A hybrid model with mamba/linear-attention layers has constraints on PIECEWISE
# (see vllm/config/compilation.py, the cudagraph_mode validation around line 1189),
# so an arm can ask for one mode and run another without failing. The engine logs
# the value it settled on:
#
#     grep -h "cudagraph_mode" experiments/*/server.log
#
# Check that against the arm name before comparing anything. Two arms that silently
# resolved to the same mode will differ only by noise, and that reads as "the mode
# does not matter".

gpu_counts:
  - 1

experiments:
  - name: "qwen36-35b-a3b"
    model: "Qwen/Qwen3.6-35B-A3B-FP8"
    prompt: "Summarize the following text: The NVIDIA H200 platform provides high memory bandwidth for large-scale inference."
    batch_size: 4
    sequence_length: 2048
    num_steps: 40
    ep: 1
    dp: 1
    tp: 1
    pp: 1

    vllm_args:
      - "--trust-remote-code"
      - "--tensor-parallel-size"
      - "1"
      - "--gpu-memory-utilization"
      - "0.95"
      - "--max-num-batched-tokens"
      - "8192"
      - "--max-num-seqs"
      - "256"
      - "--max-model-len"
      - "auto"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "qwen3_xml"
      - "--reasoning-parser"
      - "qwen3"
      - "--mm-encoder-tp-mode"
      - "data"

    guidellm_command:
      - "run"
      - "--backend"
      - "kind=openai_http,target=http://localhost:8000/v1,model=Qwen/Qwen3.6-35B-A3B-FP8,max_tokens=1024"
      - "--profile"
      - "kind=concurrent,streams=16,warmup=0.1,cooldown=0.1"
      - "--constraint"
      - "kind=max_duration,seconds=300"
      - "--constraint"
      - "kind=over_saturation"
      - "--data"
      - "kind=synthetic_text,prompt_tokens=16384,output_tokens=1024"
      - "--output"
      - "kind=json,path=/workspace/qwen36-sweep.json"

    # Variant vllm_args are appended AFTER the base list, so a variant can
    # override a base flag -- vLLM's parser takes the last occurrence.
    variants:

      # --- control -------------------------------------------------------
      # vLLM's V1 default. Every other arm is read against this one.
      - name: "full-and-piecewise"
        vllm_args:
          - "--compilation-config"
          - '{"cudagraph_mode": "FULL_AND_PIECEWISE"}'
        metadata: {cudagraph_mode: FULL_AND_PIECEWISE, spec: none}

      # --- cudagraph modes ------------------------------------------------
      # Piecewise only: graphs around the compiled regions, attention left
      # outside them. Isolates what full-graph capture of decode buys.
      - name: "piecewise"
        vllm_args:
          - "--compilation-config"
          - '{"cudagraph_mode": "PIECEWISE"}'
        metadata: {cudagraph_mode: PIECEWISE, spec: none}

      # Full graphs for decode batches, nothing for mixed prefill-decode.
      - name: "full-decode-only"
        vllm_args:
          - "--compilation-config"
          - '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
        metadata: {cudagraph_mode: FULL_DECODE_ONLY, spec: none}

      # Full graphs everywhere. Most likely of the four to be downgraded on a
      # hybrid model -- check the resolved mode in the log for this arm first.
      - name: "full"
        vllm_args:
          - "--compilation-config"
          - '{"cudagraph_mode": "FULL"}'
        metadata: {cudagraph_mode: FULL, spec: none}

      # --- speculative decoding -------------------------------------------
      # MTP, not a separate draft checkpoint: for qwen3_5_moe vLLM rewrites the
      # architecture to Qwen3_5MoeMTP and drafts with the head inside this
      # checkpoint. It routes through EagleProposer -- SpeculativeConfig.use_eagle()
      # returns True for "mtp" -- so this IS the EAGLE path for this model.
      #
      # PRECONDITION: the checkpoint must carry `mtp_num_hidden_layers`. If it is
      # absent these three arms fail at engine startup, and they fail the same way
      # a VRAM leak does, so verify it before blaming the harness:
      #   python -c "from transformers import AutoConfig; c=AutoConfig.from_pretrained(
      #     'Qwen/Qwen3.6-35B-A3B-FP8', trust_remote_code=True);
      #     t=getattr(c,'text_config',c); print(getattr(t,'mtp_num_hidden_layers',None))"
      #
      # k is swept because acceptance falls off with draft depth: the k-th token is
      # only reached if all k-1 before it were accepted. Whether k=3 beats k=1
      # depends on an acceptance rate this sweep measures rather than assumes.
      - name: "mtp-k1"
        vllm_args:
          - "--speculative-config"
          - '{"method": "mtp", "num_speculative_tokens": 1}'
        metadata: {cudagraph_mode: default, spec: mtp, k: 1}

      - name: "mtp-k2"
        vllm_args:
          - "--speculative-config"
          - '{"method": "mtp", "num_speculative_tokens": 2}'
        metadata: {cudagraph_mode: default, spec: mtp, k: 2}

      - name: "mtp-k3"
        vllm_args:
          - "--speculative-config"
          - '{"method": "mtp", "num_speculative_tokens": 3}'
        metadata: {cudagraph_mode: default, spec: mtp, k: 3}

      # --- no graphs ------------------------------------------------------
      # The floor, and the reference for how much of the win is graph capture.
      # Slowest arm; last so a timeout here costs least.
      - name: "eager"
        vllm_args:
          - "--enforce-eager"
        metadata: {cudagraph_mode: NONE, spec: none}
